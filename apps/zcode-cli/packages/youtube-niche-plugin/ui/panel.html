<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Niche Explorer</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        font: 13px system-ui, sans-serif;
        color: #222;
        background: #fafafa;
      }
      .panel {
        max-width: 480px;
        margin: 16px auto;
        padding: 20px;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        background: #fff;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 15px;
      }
      .item {
        padding: 10px 0;
        border-top: 1px solid #f0f0f0;
      }
      .item .name {
        font-weight: 600;
      }
      .item .meta {
        margin-top: 2px;
        color: #888;
        font-size: 12px;
      }
      .item .notes {
        margin-top: 2px;
        color: #555;
      }
      .empty,
      .hint {
        color: #888;
      }
      .error {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <div class="panel" id="root">
      <h1>Niche Explorer · 细分领域探索</h1>
      <p class="empty">Loading…</p>
    </div>

      /*__PANEL_BOOTSTRAP__*/

  </body>
</html>
