<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Niche Explorer</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        font: 13px system-ui, sans-serif;
        color: #222;
        background: #fafafa;
      }
      .panel {
        max-width: 480px;
        margin: 16px auto;
        padding: 20px;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        background: #fff;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 15px;
      }
      .item {
        padding: 10px 0;
        border-top: 1px solid #f0f0f0;
        cursor: pointer;
      }
      .item:focus {
        outline: 2px solid #ddd;
      }
      .item .name {
        font-weight: 600;
      }
      .item .meta {
        margin-top: 2px;
        color: #888;
        font-size: 12px;
      }
      .item .notes {
        margin-top: 2px;
        color: #555;
      }
      .item.expanded {
        border-left: 3px solid #1a73e8;
        padding-left: 8px;
      }
      .quota {
        margin: 8px 0 2px;
        height: 6px;
        border-radius: 3px;
        background: #eee;
        overflow: hidden;
      }
      .quota-fill {
        height: 100%;
        background: #1a73e8;
      }
      .quota-text {
        color: #888;
        font-size: 12px;
        margin-bottom: 6px;
      }
      .auth {
        margin: 8px 0;
        padding: 8px;
        border: 1px solid #f2c94c;
        border-radius: 8px;
        background: #fdf6e3;
      }
      .auth-title {
        font-size: 12px;
        color: #7a5c00;
        margin-bottom: 4px;
      }
      .auth a {
        font-size: 11px;
        word-break: break-all;
      }
      .videos {
        margin-top: 6px;
      }
      .videos table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .videos th,
      .videos td {
        text-align: left;
        padding: 4px 6px 4px 0;
        border-top: 1px solid #f0f0f0;
        vertical-align: top;
      }
      .videos th {
        color: #888;
        font-weight: 500;
      }
      .export {
        margin-top: 6px;
        padding: 4px 10px;
        font: inherit;
        font-size: 12px;
        color: #444;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
        cursor: pointer;
        max-width: 100%;
        overflow-wrap: anywhere;
      }
      .export:hover:not(:disabled) {
        border-color: #bbb;
      }
      .export:disabled {
        cursor: default;
        color: #888;
      }
      .empty,
      .hint {
        color: #888;
      }
      .error {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <div class="panel" id="root">
      <h1>Niche Explorer · 细分领域探索</h1>
      <p class="empty">Loading…</p>
    </div>
    <script>
      /*__PANEL_BOOTSTRAP__*/
    </script>
  </body>
</html>
